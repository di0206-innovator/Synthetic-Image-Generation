[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthimg"
version = "1.0.0"
description = "Pure-NumPy Procedural Image Synthesis, Vectorized Spatial Filtering & Synthetic CV Dataset Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Divyanshu Sinha"}
]
keywords = ["numpy", "computer-vision", "synthetic-data", "image-processing", "signed-distance-fields", "coco"]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "streamlit>=1.28.0",
]

[project.scripts]
synthimg = "synthimg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
